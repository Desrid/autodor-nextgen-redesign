      .label-outline-text { fill: #20b84b; font: 700 14px Arial, Helvetica, sans-serif; }
      .construction-label { fill: #fff; stroke: #ff8b61; stroke-width: 1.5; }
      .construction-text { fill: #ed7048; font: 700 13px Arial, Helvetica, sans-serif; }
      .route-label { fill: #fff; stroke: #aeb3b1; stroke-width: 1; }
      .route-text { fill: #59605c; font: 700 15px Arial, Helvetica, sans-serif; }
      .port { fill: #55aee6; font: 700 12px Arial, Helvetica, sans-serif; }
      .port-symbol { fill: #55aee6; font: 700 22px Arial, Helvetica, sans-serif; }
      .legend { fill: #313632; font: 700 16px Arial, Helvetica, sans-serif; }

      .land { fill: #f1f2f2; stroke: #fff; stroke-width: 2; }
      .border { fill: none; stroke: #fff; stroke-width: 1.25; opacity: .94; }
      .managed { fill: none; stroke: #ff8b61; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
      .construction { fill: none; stroke: #ff8b61; stroke-width: 3.4; stroke-dasharray: 8 5; stroke-linecap: round; }
      .prospect { fill: none; stroke: #20bb50; stroke-width: 3.2; stroke-dasharray: 6 5; stroke-linecap: round; stroke-linejoin: round; }
      .city { fill: #252925; font: 700 17px Arial, Helvetica, sans-serif; paint-order: stroke; stroke: #f1f2f2; stroke-width: 3; stroke-linejoin: round; }
      .minor { fill: #777b77; font: 600 12px Arial, Helvetica, sans-serif; }
      .sea { fill: #6aaee0; font: 700 13px Arial, Helvetica, sans-serif; }
      .country { fill: #8b8f8d; font: 700 24px Arial, Helvetica, sans-serif; letter-spacing: .02em; }

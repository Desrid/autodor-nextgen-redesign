<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Направления развития сети автомобильных дорог Автодора</title>
  <desc id="desc">Векторная презентационная схема сети Автодора: действующие дороги, перспективные проекты, строящиеся участки и морские порты. Не предназначена для навигации.</desc>
  <defs>

name: CI

on:
  pull_request:
  push:
    branches:
      - codex/all-blocks-changes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run integration quality harness
        run: npm run harness:ci

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Run functional browser tests
        run: npx playwright test --grep-invert "@visual" --workers=1
        env:
          CI: "true"
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-reports
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  visual:
    runs-on: windows-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install chromium
      - name: Run Windows visual regression
        run: npx playwright test --grep "@visual" --workers=1
        env:
          CI: "true"
      - name: Upload visual reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-reports-windows
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
